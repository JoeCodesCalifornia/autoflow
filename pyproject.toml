[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoflow"
version = "0.1.0"
description = "A general-purpose automation framework with DAG pipelines, retries, scheduling, and run history."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "The Autoflow Authors" },
]
keywords = ["automation", "pipeline", "dag", "scheduler", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
http = ["httpx>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.7",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pre-commit>=4.0",
]

[project.scripts]
autoflow = "autoflow.cli:main"

[project.urls]
Homepage = "https://github.com/autoflow-dev/autoflow"
Documentation = "https://github.com/autoflow-dev/autoflow#readme"
Issues = "https://github.com/autoflow-dev/autoflow/issues"

[project.entry-points."autoflow.tasks"]
shell = "autoflow.tasks.shell:ShellTask"
"http.request" = "autoflow.tasks.http:HttpRequestTask"
"files.copy" = "autoflow.tasks.files:CopyTask"
"files.move" = "autoflow.tasks.files:MoveTask"
"files.delete" = "autoflow.tasks.files:DeleteTask"
"files.write" = "autoflow.tasks.files:WriteTask"
"files.read" = "autoflow.tasks.files:ReadTask"
"files.mkdir" = "autoflow.tasks.files:MkdirTask"


[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/runtest",
    "/Makefile",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "RUF",
]
ignore = [
    "A002",
    "A003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["autoflow"]
mypy_path = "src"
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["httpx"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: longer integration tests that touch the filesystem or subprocesses",
    "slow: tests that take more than a moment",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["autoflow"]
branch = true
omit = ["src/autoflow/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
